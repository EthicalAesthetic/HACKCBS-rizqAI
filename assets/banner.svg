<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">RizqAI</title>
  <desc id="desc">RizqAI wordmark — multi-agent financial research.</desc>
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#A21CAF"/>
      <stop offset="75%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4C1D95" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- wordmark: pure text, no background shapes -->
  <text x="500" y="112" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="102" fill="url(#textGrad)" filter="url(#softShadow)">Rizq<tspan dx="-20" fill="url(#aiGrad)">AI</tspan></text>

  <!-- delicate flourish rule -->
  <path d="M368 142 Q500 160 632 142" fill="none" stroke="url(#ruleGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85"/>
  <circle cx="500" cy="159" r="3" fill="#DB2777"/>

  <!-- tagline -->
  <text x="500" y="186" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="3.5" fill="#8B5FA8" font-weight="600">MULTI-AGENT FINANCIAL RESEARCH</text>
</svg>
