services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/analysis/health').getcode() == 200 else 1)"
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy